<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Eugilizer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .contact-box {
            margin-bottom: 30px;
        }

        .contact-box h2,
        .social-box h2 {
            color: #1769aa;
            margin-bottom: 15px;
            border-bottom: 2px solid #1769aa;
            padding-bottom: 8px;
        }

        .item {
            display: block;
            text-decoration: none;
            color: #222;
            background: #f5f7fa;
            margin: 10px 0;
            padding: 14px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .item:hover {
            background: #1769aa;
            color: white;
            transform: translateX(5px);
        }

        .social {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social a {
            text-decoration: none;
            color: white;
            background: #333;
            padding: 14px;
            text-align: center;
            border-radius: 10px;
            transition: 0.3s;
        }

        .social a:hover {
            transform: scale(1.05);
        }

        .facebook {
            background: #1877f2 !important;
        }

        .instagram {
            background: #583037 !important;
        }

        .tiktok {
            background: #111 !important;
        }

        .whatsapp {
            background: #25d366 !important;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                margin: 20px auto;
                padding: 20px;
            }

            .social {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
